<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f5ff">
<title>Knowledge Quest</title>
<style>
:root{--ink:#232b45;--muted:#69738b;--blue:#5268d7;--line:#e4e8f2;--good:#218258;--bad:#b63e50}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:linear-gradient(145deg,#eff2ff,#eff8f1);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit}button{touch-action:manipulation;cursor:pointer}
.app{width:min(1080px,100%);margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:11px}.logo{width:48px;height:48px;display:grid;place-items:center;background:#fff;border-radius:15px;font-size:26px}
h1{font-size:clamp(1.2rem,4vw,1.8rem);margin:0 0 3px}.muted{color:var(--muted);line-height:1.5}
.score{background:#fff;border:1px solid var(--line);border-radius:99px;padding:10px 14px;font-weight:800;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:#fff;border:1px solid #e7eaf2;border-radius:20px;box-shadow:0 12px 34px #24315b12;overflow:hidden}
.visual{min-height:290px;display:grid;place-items:center;padding:20px;background:radial-gradient(circle,#fff,#edf0ff)}
.visual img{max-width:100%;max-height:360px;object-fit:contain;border-radius:14px}
.reaction{text-align:center;animation:pop .35s ease}.emoji{font-size:clamp(80px,14vw,140px)}.badge{font-weight:900;color:#634bba}
@keyframes pop{0%{transform:scale(.5);opacity:.4}75%{transform:scale(1.1)}100%{transform:scale(1);opacity:1}}
.caption,.panel{padding:18px}.caption strong{display:block}.tag{display:inline-block;padding:7px 10px;border-radius:99px;background:#eef0ff;color:#4156b9;font-weight:800;margin-bottom:12px}
.field{margin:12px 0}.field label{display:block;font-weight:750;margin-bottom:5px}
input,select{width:100%;min-height:43px;padding:9px 11px;border:1px solid #d8deea;border-radius:11px;background:white;color:var(--ink)}
.primary{width:100%;border:0;border-radius:11px;padding:12px;background:var(--blue);color:#fff;font-weight:800}
.primary:disabled{background:#e6e9f1;color:#8790a4}
.hidden{display:none!important}.progressline{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;margin:10px 0}
.track{height:9px;background:#eaedf4;border-radius:99px;overflow:hidden;margin-bottom:18px}.fill{height:100%;background:#48a773;width:0}
.qtitle{margin:0 0 8px;font-size:1.35rem}.answers{display:grid;gap:9px}
.answer{min-height:48px;text-align:left;padding:10px 13px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.answer.selected{border-color:var(--blue);background:#f1f3ff}
.answer.correct{border-color:#61b88b;background:#effaf4}
.answer:disabled{cursor:default}
.feedback{min-height:44px;margin:12px 0;color:var(--muted);line-height:1.45}.good{color:var(--good)}.bad{color:var(--bad)}
.word-zone{min-height:52px;padding:7px;border:2px dashed #cbd2e3;border-radius:12px;margin:8px 0;display:flex;flex-wrap:wrap;gap:6px}
.word-bank{display:flex;flex-wrap:wrap;gap:7px}.word{border:1px solid #cfd6e6;border-radius:10px;background:#fff;padding:9px 12px}
.result{text-align:center}.result .emoji{font-size:70px}
@media(max-width:760px){.grid{grid-template-columns:1fr}.visual{min-height:220px}}
@media(max-width:480px){body{padding:10px}.logo{width:42px;height:42px}.score{padding:9px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div class="brand"><div class="logo">🎒</div><div><h1 id="title"></h1><div class="muted" id="subtitle"></div></div></div>
  <div class="score"><span id="scoreLabel"></span> <span id="score">0</span></div>
</header>
<div class="grid">
  <section class="card">
    <div class="visual" id="visual" aria-live="polite"></div>
    <div class="caption"><strong id="visualTitle"></strong><span class="muted" id="visualCaption"></span></div>
  </section>
  <section class="card panel">
    <div id="setup">
      <span class="tag" id="studentTag"></span>
      <h2 class="qtitle" id="setupTitle"></h2>
      <p class="muted" id="setupHelp"></p>
      <div class="field"><label id="classLabel" for="classSelect"></label><select id="classSelect"></select></div>
      <div class="field"><label id="modeLabel" for="mode"></label>
        <select id="mode"><option value="mixed"></option><option value="single"></option></select></div>
      <div class="field hidden" id="subjectField"><label id="subjectLabel" for="subject"></label><select id="subject"></select></div>
      <div class="field"><label id="topicLabel" for="topic"></label><select id="topic"></select></div>
      <p class="muted" id="difficultyInfo"></p>
      <button class="primary" id="start"></button>
    </div>
    <div id="play" class="hidden" aria-live="polite">
      <span class="tag" id="qTag"></span>
      <div class="progressline"><span id="qCount"></span><span id="percent"></span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <h2 class="qtitle" id="qTitle"></h2><p class="muted" id="qText"></p>
      <div class="answers" id="answers"></div>
      <p class="feedback" id="feedback"></p>
      <button class="primary" id="answerButton" disabled></button>
    </div>
    <div id="result" class="result hidden">
      <div class="emoji" id="resultEmoji"></div><h2 id="resultTitle"></h2>
      <p class="muted" id="resultText"></p><button class="primary" id="again"></button>
    </div>
  </section>
</div>
</main>

<script>
const LANG = (() => {
  const n = (navigator.languages?.[0] || navigator.language || "en").toLowerCase();
  if (n.startsWith("pl")) return "pl";
  if (n.startsWith("ja")) return "ja";
  return "en";
})();

const UI = {
  en: {
    title:"Knowledge Quest", subtitle:"Learn, earn badges, and have fun.",
    score:"Points:", student:"Student panel", setup:"Choose your question set",
    setupHelp:"The teacher chooses the difficulty.", class:"Class", mode:"Question set",
    mixed:"Mixed subjects", single:"One subject", subject:"Subject", topic:"Topic",
    allTopics:"All topics", start:"Start game", difficulty:"Teacher-set difficulty:",
    question:"Question", of:"of", choose:"Choose or enter an answer",
    check:"Check answer", next:"Next question", result:"See results", again:"Play again",
    yes:"Yes", no:"No", typeWord:"Tap words to build the sentence:",
    enter:"Type your answer", image:"Question illustration",
    correct:"Correct! ", wrong:"Not quite. ", earned:"Badge earned!",
    tryAgain:"Keep learning!", correctMsg:"Great answer — you earned a point.",
    wrongMsg:"Mistakes are part of learning. Read the explanation and keep going.",
    noQuestions:"No questions match this choice. Ask your teacher to add some.",
    finished:"Correct answers:", excellent:"Excellent result!", good:"Well done!", practice:"Practice makes progress!",
    noImage:"Choose a mission to begin. If a question has an illustration, it will appear here.",
    missingImage:"Could not load the illustration. Check its path in questions.json.",
    one:"One answer", many:"Multiple answers", boolean:"Yes or no", text:"Type the answer", words:"Build the sentence",
    chooseClass:"Choose a class", className:"Class"
  },
  pl: {
    title:"Misja: Mistrzowie wiedzy", subtitle:"Ucz się, zdobywaj odznaki i baw się dobrze.",
    score:"Punkty:", student:"Panel ucznia", setup:"Wybierz zestaw pytań",
    setupHelp:"Poziom trudności ustala nauczyciel.", class:"Klasa", mode:"Rodzaj zestawu",
    mixed:"Zestaw mieszany", single:"Jeden przedmiot", subject:"Przedmiot", topic:"Temat",
    allTopics:"Wszystkie tematy", start:"Rozpocznij grę", difficulty:"Poziom ustalony przez nauczyciela:",
    question:"Pytanie", of:"z", choose:"Wybierz lub wpisz odpowiedź",
    check:"Sprawdź odpowiedź", next:"Następne pytanie", result:"Zobacz wynik", again:"Zagraj ponownie",
    yes:"Tak", no:"Nie", typeWord:"Dotknij słów, aby ułożyć zdanie:",
    enter:"Wpisz odpowiedź", image:"Ilustracja do pytania",
    correct:"Dobrze! ", wrong:"Tym razem niepoprawnie. ", earned:"Odznaka zdobyta!",
    tryAgain:"Następnym razem będzie lepiej!", correctMsg:"Dobra odpowiedź — zdobywasz punkt.",
    wrongMsg:"Pomyłki są częścią nauki. Przeczytaj wyjaśnienie i próbuj dalej.",
    noQuestions:"Brak pytań dla tego wyboru. Poproś nauczyciela o dodanie pytań.",
    finished:"Poprawne odpowiedzi:", excellent:"Fantastyczny wynik!", good:"Dobra robota!", practice:"Trening czyni mistrza!",
    noImage:"Wybierz misję, aby rozpocząć. Ilustracja pytania pokaże się tutaj, jeśli została dodana.",
    missingImage:"Nie udało się wczytać ilustracji. Sprawdź ścieżkę w questions.json.",
    one:"Jedna odpowiedź", many:"Wiele odpowiedzi", boolean:"Tak albo nie", text:"Wpisz odpowiedź", words:"Ułóż zdanie",
    chooseClass:"Wybierz klasę", className:"Klasa"
  },
  ja: {
    title:"知識クエスト", subtitle:"学んで、バッジを集めて、楽しもう。",
    score:"ポイント:", student:"生徒パネル", setup:"問題セットを選んでください",
    setupHelp:"難易度は先生が設定します。", class:"クラス", mode:"問題セット",
    mixed:"複数科目", single:"1つの科目", subject:"科目", topic:"テーマ",
    allTopics:"すべてのテーマ", start:"ゲーム開始", difficulty:"先生が設定した難易度:",
    question:"問題", of:"/", choose:"答えを選ぶか入力してください",
    check:"答えを確認", next:"次の問題", result:"結果を見る", again:"もう一度遊ぶ",
    yes:"はい", no:"いいえ", typeWord:"単語をタップして文を作りましょう：",
    enter:"答えを入力", image:"問題のイラスト",
    correct:"正解！", wrong:"今回は不正解です。", earned:"バッジを獲得！",
    tryAgain:"次はきっとうまくいくよ！", correctMsg:"正解です。ポイントを獲得しました。",
    wrongMsg:"間違いも学びの一部です。解説を読んで続けましょう。",
    noQuestions:"この条件に合う問題がありません。先生に問題の追加をお願いしてください。",
    finished:"正解数:", excellent:"すばらしい結果！", good:"よくできました！", practice:"練習を続けよう！",
    noImage:"ミッションを選んで始めましょう。問題にイラストがあればここに表示されます。",
    missingImage:"イラストを読み込めません。questions.json のパスを確認してください。",
    one:"1つ選択", many:"複数選択", boolean:"はい・いいえ", text:"答えを入力", words:"文を作る",
    chooseClass:"クラスを選択", className:"クラス"
  }
}[LANG];

const $ = id => document.getElementById(id);
let data, questions=[], index=0, score=0, selected=null, multi=new Set(), tiles=[], chosen=[], answered=false;

function loc(value) {
  if (typeof value === "string") return value;
  return value?.[LANG] || value?.en || value?.pl || "";
}
function shuffle(a) {
  a=[...a];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function say(id) { return UI[id] || id; }
function initUI() {
  document.documentElement.lang=LANG;
  $("title").textContent=say("title");
  $("subtitle").textContent=say("subtitle");
  $("scoreLabel").textContent=say("score");
  $("studentTag").textContent="🎒 "+say("student");
  $("setupTitle").textContent=say("setup");
  $("setupHelp").textContent=say("setupHelp");
  $("classLabel").textContent=say("class");
  $("modeLabel").textContent=say("mode");
  $("mode").options[0].textContent=say("mixed");
  $("mode").options[1].textContent=say("single");
  $("subjectLabel").textContent=say("subject");
  $("topicLabel").textContent=say("topic");
  $("start").textContent=say("start");
  $("again").textContent=say("again");
  $("visualTitle").textContent=say("title");
  $("visualCaption").textContent=say("noImage");
}
function className(c) { return loc(c.names) || c.id; }

async function loadData() {
  initUI();
  try {
    const url=new URL("./questions.json",location.href);
    url.searchParams.set("v",Date.now());
    const response=await fetch(url,{cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    data=await response.json();
    if(!Array.isArray(data.questions)||!Array.isArray(data.classes)) throw new Error("Invalid JSON structure");
    fillFilters();
  } catch(error) {
    $("setup").innerHTML=`<p class="muted">Could not load questions.json. Check that it is in the same GitHub folder as index.html. / Nie udało się wczytać questions.json. / questions.json を読み込めません。</p>`;
  }
}
function fillFilters() {
  const classes=data.classes;
  $("classSelect").innerHTML=classes.map(c=>`<option value="${c.id}">${escapeHtml(className(c))}</option>`).join("");
  $("difficultyInfo").textContent=say("difficulty")+" "+(data.settings?.difficulty||"Easy");
  updateSubjects();
}
function updateSubjects() {
  const classId=$("classSelect").value;
  const single=$("mode").value==="single";
  $("subjectField").classList.toggle("hidden",!single);
  const qs=data.questions.filter(q=>q.classId===classId&&q.difficulty===(data.settings?.difficulty||"Easy"));
  const subjects=[...new Set(qs.map(q=>loc(q.subject)))];
  $("subject").innerHTML=subjects.map(s=>`<option>${escapeHtml(s)}</option>`).join("");
  updateTopics();
}
function updateTopics() {
  const classId=$("classSelect").value, single=$("mode").value==="single", subject=$("subject").value;
  const qs=data.questions.filter(q=>q.classId===classId&&q.difficulty===(data.settings?.difficulty||"Easy")&&(!single||loc(q.subject)===subject));
  const topics=[...new Set(qs.map(q=>loc(q.topic)))];
  $("topic").innerHTML=`<option value="">${say("allTopics")}</option>`+topics.map(t=>`<option>${escapeHtml(t)}</option>`).join("");
}
$("classSelect").addEventListener("change",updateSubjects);
$("mode").addEventListener("change",updateSubjects);
$("subject").addEventListener("change",updateTopics);

$("start").addEventListener("click",()=>{
  const classId=$("classSelect").value, single=$("mode").value==="single";
  const subject=$("subject").value, topic=$("topic").value;
  questions=shuffle(data.questions.filter(q=>
    q.classId===classId&&q.difficulty===(data.settings?.difficulty||"Easy")&&
    (!single||loc(q.subject)===subject)&&(!topic||loc(q.topic)===topic)
  ));
  if(!questions.length){alert(say("noQuestions"));return}
  index=0;score=0;$("score").textContent="0";
  $("setup").classList.add("hidden");$("result").classList.add("hidden");$("play").classList.remove("hidden");
  renderQuestion();
});

function renderQuestion() {
  const q=questions[index],type=q.type||"single";
  selected=null;multi=new Set();chosen=[];tiles=[];answered=false;
  $("qTag").textContent=typeLabel(type)+" · "+loc(q.subject)+" · "+loc(q.topic);
  $("qCount").textContent=`${say("question")} ${index+1} ${say("of")} ${questions.length}`;
  $("percent").textContent=Math.round(index/questions.length*100)+"%";
  $("fill").style.width=Math.round(index/questions.length*100)+"%";
  $("qTitle").textContent=loc(q.subject);
  $("qText").textContent=loc(q.question);
  $("answers").innerHTML="";$("feedback").textContent="";$("answerButton").disabled=true;
  $("answerButton").textContent=say("choose");
  showQuestionImage(q);

  if(type==="word_order") renderWords(q);
  else if(type==="text") {
    const input=document.createElement("input");input.id="typed";input.placeholder=say("enter");
    input.addEventListener("input",ready);$("answers").append(input);
  } else if(type==="boolean") {
    [true,false].forEach(value=>addAnswer(value?say("yes"):say("no"),()=>{selected=value;markSelection();ready()}));
  } else {
    (q.answers?.[LANG]||q.answers?.en||q.answers?.pl||[]).forEach((text,i)=>{
      addAnswer(text,button=>{
        if(type==="multiple"){multi.has(i)?multi.delete(i):multi.add(i);button.classList.toggle("selected")}
        else {selected=i;markSelection(button)}
        ready();
      });
    });
  }
  ready();
}
function typeLabel(type){return say(({single:"one",multiple:"many",boolean:"boolean",text:"text",word_order:"words"})[type]||"one")}
function addAnswer(text,callback) {
  const b=document.createElement("button");b.type="button";b.className="answer";b.textContent=text;
  b.addEventListener("click",()=>{if(!answered)callback(b)});$("answers").appendChild(b);
}
function markSelection(button) {
  [...$("answers").querySelectorAll(".answer")].forEach(b=>b.classList.toggle("selected",b===button));
}
function renderWords(q) {
  const words=q.words?.[LANG]||q.words?.en||q.words?.pl||[];
  tiles=shuffle(words.map((text,i)=>({id:String(i),text})));
  const zone=document.createElement("div");zone.className="word-zone";zone.id="wordZone";
  const bank=document.createElement("div");bank.className="word-bank";bank.id="wordBank";
  const help=document.createElement("p");help.className="muted";help.textContent=say("typeWord");
  $("answers").append(help,zone,bank);
  drawWords();
}
function drawWords() {
  const zone=$("wordZone"),bank=$("wordBank");if(!zone||!bank)return;
  zone.innerHTML="";bank.innerHTML="";
  chosen.forEach(id=>{const item=tiles.find(t=>t.id===id);zone.append(wordButton(item,()=>{chosen=chosen.filter(x=>x!==id);drawWords();ready()}))});
  tiles.filter(t=>!chosen.includes(t.id)).forEach(item=>bank.append(wordButton(item,()=>{chosen.push(item.id);drawWords();ready()})));
}
function wordButton(item,fn){const b=document.createElement("button");b.className="word";b.type="button";b.textContent=item.text;b.onclick=fn;return b}
function ready() {
  const q=questions[index],type=q.type||"single";
  const ok=type==="text"?Boolean($("typed")?.value.trim()):type==="word_order"?chosen.length===(q.correctWords?.[LANG]||q.correctWords?.en||q.correctWords?.pl||[]).length:type==="multiple"?multi.size>0:selected!==null;
  $("answerButton").disabled=!ok;
}
function normalize(s){return String(s).trim().toLocaleLowerCase(LANG).replace(/[.!?,;:]+$/g,"").replace(/\s+/g," ")}
function check(q) {
  const type=q.type||"single";
  if(type==="single")return selected===q.correct;
  if(type==="boolean")return selected===q.correctBoolean;
  if(type==="multiple")return JSON.stringify([...multi].sort())===JSON.stringify([...q.correctAnswers].sort());
  if(type==="text")return (q.acceptedAnswers?.[LANG]||q.acceptedAnswers?.en||q.acceptedAnswers?.pl||[]).some(a=>normalize(a)===normalize($("typed").value));
  const expected=q.correctWords?.[LANG]||q.correctWords?.en||q.correctWords?.pl||[];
  return JSON.stringify(chosen.map(id=>tiles.find(t=>t.id===id).text))===JSON.stringify(expected);
}
$("answerButton").addEventListener("click",()=>{
  if(answered){if(index<questions.length-1){index++;renderQuestion()}else finish();return}
  const q=questions[index],ok=check(q);answered=true;
  $("answers").querySelectorAll("button,input").forEach(x=>x.disabled=true);
  if(ok){score++;$("score").textContent=score;$("feedback").textContent=say("correct")+(loc(q.explanation)||"");$("feedback").className="feedback good"}
  else{$("feedback").textContent=say("wrong")+(loc(q.explanation)||"");$("feedback").className="feedback bad"}
  markCorrect(q);
  if(!q.image) reaction(ok);
  $("fill").style.width=Math.round((index+1)/questions.length*100)+"%";
  $("percent").textContent=Math.round((index+1)/questions.length*100)+"%";
  $("answerButton").textContent=index<questions.length-1?say("next"):say("result");
  $("answerButton").disabled=false;
});
function markCorrect(q) {
  const type=q.type||"single";
  if(type==="single")$("answers").children[q.correct]?.classList.add("correct");
  if(type==="boolean")$("answers").children[q.correctBoolean?0:1]?.classList.add("correct");
  if(type==="multiple")q.correctAnswers.forEach(i=>$("answers").children[i]?.classList.add("correct"));
}
function showQuestionImage(q) {
  if(!q.image){$("visual").innerHTML=`<div class="muted">${say("noImage")}</div>`;return}
  const img=document.createElement("img");img.src=q.image;img.alt=loc(q.imageAlt)||loc(q.topic);
  img.onerror=()=>{$("visual").textContent=say("missingImage")};$("visual").replaceChildren(img);
  $("visualTitle").textContent=say("image");$("visualCaption").textContent=loc(q.imageAlt)||loc(q.topic);
}
function reaction(ok) {
  const items=ok?[["🏅","🏅","🌟","🎉","🦊","👑","🚀"],["Great job!","Great job!","Brilliant!","Well done!","Clever!","Knowledge champion!","Keep going!"]]:
    [["😟","😢","🙁","🫤","😕"],["Try again!","Oh no!","Almost!","Keep learning!","Every mistake teaches us!"]];
  const i=Math.floor(Math.random()*items[0].length);
  $("visual").innerHTML=`<div class="reaction"><div class="emoji">${items[0][i]}</div><div class="badge">${items[1][i]}</div></div>`;
  $("visualTitle").textContent=ok?say("earned"):say("tryAgain");
  $("visualCaption").textContent=ok?say("correctMsg"):say("wrongMsg");
}
function finish() {
  $("play").classList.add("hidden");$("result").classList.remove("hidden");
  const pct=Math.round(score/questions.length*100);
  $("resultEmoji").textContent=pct>=80?"🏆":pct>=50?"🌟":"💪";
  $("resultTitle").textContent=pct>=80?say("excellent"):pct>=50?say("good"):say("practice");
  $("resultText").textContent=`${say("finished")} ${score} / ${questions.length} (${pct}%).`;
}
$("again").addEventListener("click",()=>{$("result").classList.add("hidden");$("setup").classList.remove("hidden");showStartVisual()});
function escapeHtml(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
loadData();
</script>
</body>
</html>
